# EXAMPLE MANIFEST — copy to deploy/relay-k8s.local.yaml (ignored by git) and
# adapt registry, domains, gateway name and storage class to your cluster.
# Do not commit the real manifest with your internal hostnames.
#
# Relay deployment for the "networking" namespace.
#
# Required secrets (create them before applying):
#
#   kubectl -n networking create secret generic proxy-relay-tls \
#     --from-file=server.pem=relay-pki/server/server.pem \
#     --from-file=server-key.pem=relay-pki/server/server-key.pem \
#     --from-file=ca.pem=relay-pki/ca/ca.pem
#
#   # The CA private key is needed by the enrollment endpoint to sign client
#   # certificates. Keep it in a secret with restricted RBAC access.
#   kubectl -n networking create secret generic proxy-relay-ca \
#     --from-file=ca.pem=relay-pki/ca/ca.pem \
#     --from-file=ca-key.pem=relay-pki/ca/ca-key.pem
#
#   # SMTP credentials. Start empty, fill it and restart the deployment.
#   kubectl -n networking create secret generic proxy-relay-smtp \
#     --from-literal=PROXYRELAY_SMTP_ADDR= \
#     --from-literal=PROXYRELAY_SMTP_USER= \
#     --from-literal=PROXYRELAY_SMTP_PASS= \
#     --from-literal=PROXYRELAY_SMTP_FROM= \
#     --from-literal=PROXYRELAY_SMTP_TLS=starttls \
#     --from-literal=PROXYRELAY_SMTP_AUTH=auto
#
# The enrollment endpoint is exposed only on the intranet through the Istio
# internal gateway (enroll.example.com -> 192.0.2.10:443); the
# relay pod serves it as plain HTTP behind that trusted TLS proxy.
#
# The relay keeps serving mTLS even while SMTP is empty; enrollment is disabled
# until the secret is filled and the pod is restarted. To fill it:
#   kubectl -n networking create secret generic proxy-relay-smtp \
#     --from-literal=PROXYRELAY_SMTP_ADDR=smtp.example.com:587 \
#     --from-literal=PROXYRELAY_SMTP_USER='user' \
#     --from-literal=PROXYRELAY_SMTP_PASS='password' \
#     --from-literal=PROXYRELAY_SMTP_FROM='relay@example.com' \
#     --from-literal=PROXYRELAY_SMTP_TLS=starttls \
#     --from-literal=PROXYRELAY_SMTP_AUTH=auto \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n networking rollout restart deploy/proxy-relay
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: proxy-relay-data
  namespace: networking
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-relay
  namespace: networking
  labels:
    app: proxy-relay
spec:
  replicas: 1 # the address book lives in a single file: do not scale out
  strategy:
    type: Recreate # RWO volume
  selector:
    matchLabels:
      app: proxy-relay
  template:
    metadata:
      labels:
        app: proxy-relay
      annotations:
        sidecar.istio.io/inject: "false" # mTLS must reach the pod untouched
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: relay
          image: registry.example.com/networking/proxyrelay:latest
          imagePullPolicy: Always
          args:
            - serve
            - -listen=:2443
            - -cert=/tls/server.pem
            - -key=/tls/server-key.pem
            - -ca=/tls/ca.pem
            - -state=/data/relay-state.json
            - -enroll-listen=:2444
            - -enroll-plain=true
            - -public-relay=relay.example.com:2443
            - -public-url=https://enroll.example.com
            - -allow-domains=example.com,external.example.com
            - -ca-dir=/ca
            - -enroll-state=/data/relay-enroll.json
            # Health and metrics on a pod-local port (add -metrics-token or keep it cluster-internal):
            # - -metrics-listen=:9100
            # - -log-format=json
            # Optional download link for invitation emails:
            # - -download-url=https://...
          envFrom:
            - secretRef:
                name: proxy-relay-smtp
          ports:
            - name: relay
              containerPort: 2443
            - name: enroll
              containerPort: 2444
          readinessProbe:
            tcpSocket: { port: relay }
          livenessProbe:
            tcpSocket: { port: relay }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: ca, mountPath: /ca, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: tls
          secret:
            secretName: proxy-relay-tls
        - name: ca
          secret:
            secretName: proxy-relay-ca
        - name: data
          persistentVolumeClaim:
            claimName: proxy-relay-data
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-relay
  namespace: networking
spec:
  type: LoadBalancer
  selector:
    app: proxy-relay
  ports:
    - name: relay
      port: 2443
      targetPort: relay
---
# Cluster-only service used by the intranet Istio gateway. Enrollment traffic
# is TLS-terminated at the gateway and reaches the pod as plain HTTP.
apiVersion: v1
kind: Service
metadata:
  name: proxy-relay-enroll
  namespace: networking
spec:
  type: ClusterIP
  selector:
    app: proxy-relay
  ports:
    - name: enroll
      port: 2444
      targetPort: enroll
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: proxy-relay-enroll
  namespace: networking
spec:
  gateways:
    - networking/internal-gateway
  hosts:
    - enroll.example.com
  http:
    - route:
        - destination:
            host: proxy-relay-enroll.networking.svc.cluster.local
            port:
              number: 2444
