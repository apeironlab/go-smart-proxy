name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  webui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci --prefix webui
      - run: npm run build --prefix webui
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

  darwin:
    needs: webui
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build universal package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p build/darwin-arm64 build/darwin-amd64 build/darwin-universal
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" -o build/darwin-arm64/proxy .
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" \
            go build -trimpath -ldflags "-s -w" -o build/darwin-amd64/proxy .
          lipo -create -output build/darwin-universal/proxy \
            build/darwin-arm64/proxy build/darwin-amd64/proxy
          cp README.md LICENSE build/darwin-universal/
          tar -czf "go-smart-proxy_${version}_darwin_universal.tar.gz" -C build/darwin-universal .
      - name: Build DMG installer
        run: installer/macos/build-dmg.sh build/darwin-universal/proxy "${GITHUB_REF_NAME#v}" "go-smart-proxy_${GITHUB_REF_NAME#v}_darwin_universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-universal
          path: go-smart-proxy_*_darwin_universal.*

  windows:
    needs: webui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build amd64 package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          New-Item -ItemType Directory -Force -Path build/windows, dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o build/windows/proxy.exe .
          Copy-Item README.md, LICENSE build/windows/
          Compress-Archive -Path build/windows/* -DestinationPath "go-smart-proxy_${version}_windows_amd64.zip"
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DMyAppVersion=$version" "installer\windows\go-smart-proxy.iss"
          Copy-Item "dist\go-smart-proxy_${version}_windows_amd64_setup.exe" .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            go-smart-proxy_*_windows_amd64.zip
            go-smart-proxy_*_windows_amd64_setup.exe

  linux:
    needs: webui
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install GTK/AppIndicator headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - name: Build amd64 package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p build/linux dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o build/linux/proxy .
          cp README.md LICENSE build/linux/
          tar -czf "go-smart-proxy_${version}_linux_amd64.tar.gz" -C build/linux .
      - name: Build deb and rpm packages
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          export VERSION="$version"
          "$(go env GOPATH)/bin/nfpm" package --config installer/linux/nfpm.yaml --packager deb \
            --target "go-smart-proxy_${version}_linux_amd64.deb"
          "$(go env GOPATH)/bin/nfpm" package --config installer/linux/nfpm.yaml --packager rpm \
            --target "go-smart-proxy_${version}_linux_amd64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            go-smart-proxy_*_linux_amd64.tar.gz
            go-smart-proxy_*_linux_amd64.deb
            go-smart-proxy_*_linux_amd64.rpm

  release:
    needs: [darwin, windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: darwin-universal
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-amd64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: dist
      - name: Remove non-package assets from an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
              while read -r name; do
                case "$name" in
                  *.tar.gz|*.zip|*.dmg|*.deb|*.rpm|*_setup.exe|SHA256SUMS) ;;
                  *) gh release delete-asset "$GITHUB_REF_NAME" "$name" -y ;;
                esac
              done
          fi
      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*_setup.exe' \) \
            -exec sha256sum {} + | sort -k2 > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
